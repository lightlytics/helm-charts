{{- if and (.Values.streamsec.cluster_agent_containers.enabled) (.Values.streamsec.runtime_agent_windows.enabled) }}
{{- $win := .Values.streamsec.runtime_agent_windows }}
# Windows node pools: the agent runs as a HostProcess container, i.e. a plain host
# process as NT AUTHORITY\SYSTEM (no isolation), which is what the ETW sensors and the
# HCS container resolver need. Only AKS-style containerd Windows nodes are supported.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ template "streamsec.fullname" . }}-runtime-agent-windows
  labels:
  {{- include "streamsec.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-agent-windows
  annotations:
    {{- if not .Values.streamsec.apiTokenExistingSecret }}
      checksum/api-token: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    {{- end }}
spec:
  selector:
    matchLabels:
  {{- include "streamsec.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime-agent-windows
  template:
    metadata:
      labels:
    {{- include "streamsec.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime-agent-windows
    spec:
      nodeSelector:
        {{- toYaml (mergeOverwrite (dict "kubernetes.io/os" "windows") ($win.nodeSelector | default dict)) | nindent 8 }}
      {{- with $win.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $win.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: "NT AUTHORITY\\SYSTEM"
      containers:
        - name: runtime-agent
          image: {{ include "streamsec.runtime-agent-windows-image-path" $ }}
          imagePullPolicy: {{ $win.image.pullPolicy }}
          # The image root is mounted at %CONTAINER_SANDBOX_MOUNT_POINT% on the node;
          # containerd expands the variable in the command line.
          command:
            - '%CONTAINER_SANDBOX_MOUNT_POINT%\censor.exe'
          {{- with $win.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: API_URL
              value: {{ .Values.streamsec.apiUrl | quote }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ template "streamsec.apiTokenSecretName" $ }}
                  key: api-key
            {{- if .Values.streamsec.env.CLUSTER_ID }}
            - name: CLUSTER_ID
              value: {{ .Values.streamsec.env.CLUSTER_ID | quote }}
            {{- end }}
            {{- if .Values.streamsec.env.CLUSTER_NAME }}
            - name: CLUSTER_NAME
              value: {{ .Values.streamsec.env.CLUSTER_NAME | quote }}
            {{- end }}
            {{- if .Values.streamsec.env.ACCOUNT_ID }}
            - name: ACCOUNT_ID
              value: {{ .Values.streamsec.env.ACCOUNT_ID | quote }}
            {{- end }}
            {{- if .Values.streamsec.env.REGION }}
            - name: REGION
              value: {{ .Values.streamsec.env.REGION | quote }}
            {{- end }}
            {{- if .Values.streamsec.env.RESOURCE_GROUP }}
            - name: RESOURCE_GROUP
              value: {{ .Values.streamsec.env.RESOURCE_GROUP | quote }}
            {{- end }}
            {{- if .Values.streamsec.env.AI_BODY_ENABLED }}
            - name: AI_BODY_ENABLED
              value: {{ .Values.streamsec.env.AI_BODY_ENABLED | quote }}
            {{- end }}
            {{- if .Values.streamsec.env.EXTERNAL_INBOUND_BODY_ENABLED }}
            - name: EXTERNAL_INBOUND_BODY_ENABLED
              value: {{ .Values.streamsec.env.EXTERNAL_INBOUND_BODY_ENABLED | quote }}
            {{- end }}
            {{- range $k, $v := $win.env }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- with $.Values.streamsec.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $.Values.streamsec.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          terminationMessagePolicy: FallbackToLogsOnError
      dnsPolicy: {{ .Values.dnsPolicy }}
      hostNetwork: true
      {{- $priorityClassName := default (include "streamsec.priorityClassName" .) $win.priorityClassName }}
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName | quote }}
      {{- end }}
      serviceAccountName: {{ template "streamsec.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ $win.terminationGracePeriodSeconds }}
  {{- with $win.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
