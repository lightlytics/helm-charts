{{- if and (.Values.streamsec.cluster_agent_containers.enabled) (.Values.streamsec.runtime_agent_windows | default dict).enabled }}
{{- $win := .Values.streamsec.runtime_agent_windows }}
{{- $eff := include "streamsec.runtimeAgentWindowsSettings" . | fromYaml }}
# HostProcess DaemonSet: censor.exe runs on the Windows node as NT AUTHORITY\SYSTEM.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ template "streamsec.fullname" . }}-runtime-agent-windows
  labels:
  {{- include "streamsec.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-agent-windows
spec:
  selector:
    matchLabels:
  {{- include "streamsec.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime-agent-windows
  template:
    metadata:
      labels:
    {{- include "streamsec.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime-agent-windows
      {{- if not .Values.streamsec.apiTokenExistingSecret }}
      annotations:
        checksum/api-token: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      {{- end }}
    spec:
      nodeSelector:
        {{- toYaml $eff.nodeSelector | nindent 8 }}
      {{- with $eff.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $eff.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: "NT AUTHORITY\\SYSTEM"
      containers:
        - name: runtime-agent
          image: {{ include "streamsec.runtime-agent-windows-image-path" $ }}
          imagePullPolicy: {{ $eff.pullPolicy }}
          command:
            - '%CONTAINER_SANDBOX_MOUNT_POINT%\censor.exe'
          {{- with $eff.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "streamsec.runtimeAgentEnv" (dict "root" $ "responseActions" false) | nindent 12 }}
          {{- with $.Values.streamsec.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          terminationMessagePolicy: FallbackToLogsOnError
      dnsPolicy: {{ .Values.dnsPolicy }}
      hostNetwork: true
      {{- $priorityClassName := default (include "streamsec.priorityClassName" .) $eff.priorityClassName }}
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName | quote }}
      {{- end }}
      serviceAccountName: {{ template "streamsec.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ $win.terminationGracePeriodSeconds }}
  {{- with $eff.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
